<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">

<h:head>
    <title>Registro Aspirante</title>
</h:head>

<h:body>

<h:form>

    <h2>Registro Aspirante</h2>

    <h:inputText value="#{asp.aspirante.identificacion}" required="true" placeholder="Identificación"/>
    <br/>

    <h:inputText value="#{asp.aspirante.nombres}" required="true" placeholder="Nombres"/>
    <br/>

    <h:inputText value="#{asp.aspirante.apellidos}" required="true" placeholder="Apellidos"/>
    <br/>

    <h:inputText value="#{asp.aspirante.correo}" required="true" placeholder="Correo"/>
    <br/>

    <h:inputText value="#{asp.aspirante.telefono}" required="true" placeholder="Teléfono"/>
    <br/>

    <h:selectOneMenu value="#{asp.aspirante.programa}" required="true">
        <f:selectItems value="#{asp.programas}"/>
    </h:selectOneMenu>

    <br/><br/>

    <h:commandButton value="Registrar" action="#{asp.registrar}"/>

</h:form>

<br/>
<h:link value="Ver Administrador" outcome="admin.xhtml"/>

<footer>
    Camilo Camargo - Programación Web - 2026
</footer>

</h:body>
</html>
