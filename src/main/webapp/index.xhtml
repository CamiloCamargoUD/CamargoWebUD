<!DOCTYPE html>
    <!-- CAMILO ANDRES CAMARGO GOMEZ -->

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Registro Aspirante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body {
            background-color: #e9ecef;
        }
        .card {
            margin-top: 50px;
            border-radius: 15px;
        }
        footer {
            text-align: center;
            margin-top: 30px;
            color: #6c757d;
        }
        .alert {
            margin-top: 15px;
        }
    </style>
</h:head>

<h:body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h3>📝 Registro de Aspirante</h3>
                </div>
                <div class="card-body">
                    
                    <h:form>
                        <h:messages globalOnly="true" 
                                    styleClass="alert alert-danger" 
                                    infoStyleClass="alert alert-success"
                                    showDetail="true" showSummary="false"/>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Identificación *</label>
                            <h:inputText value="#{asp.aspirante.identificacion}" required="true" 
                                         styleClass="form-control" placeholder="Ej: 12345678"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombres *</label>
                            <h:inputText value="#{asp.aspirante.nombres}" required="true" 
                                         styleClass="form-control" placeholder="Nombres completos"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Apellidos *</label>
                            <h:inputText value="#{asp.aspirante.apellidos}" required="true" 
                                         styleClass="form-control" placeholder="Apellidos completos"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Correo *</label>
                            <h:inputText value="#{asp.aspirante.correo}" required="true" 
                                         styleClass="form-control" placeholder="correo@ejemplo.com"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Teléfono</label>
                            <h:inputText value="#{asp.aspirante.telefono}" 
                                         styleClass="form-control" placeholder="Número de contacto"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Programa de interés *</label>
                            <h:selectOneMenu value="#{asp.aspirante.programa}" required="true" 
                                             styleClass="form-select">
                                <f:selectItem itemValue="" itemLabel="-- Seleccione un programa --"/>
                                <f:selectItems value="#{asp.programas}"/>
                            </h:selectOneMenu>
                        </div>
                        
                        <div class="d-grid">
                            <h:commandButton value="✅ Registrar" action="#{asp.registrar}" 
                                             styleClass="btn btn-primary btn-lg"/>
                        </div>
                    </h:form>
                </div>
            </div>
            <div class="text-center mt-3">
                <h:link value="👥 Ver administrador" outcome="admin.xhtml" styleClass="btn btn-outline-secondary"/>
            </div>
        </div>
    </div>
</div>

<footer>
    Camilo Camargo - Programación Avanzada Grupo 302, Universidad Distrital - 2026
</footer>

</h:body>
</html>
