<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
	<meta charset="UTF-8"/>
    <title>Lista de Aspirantes</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .table-container {
            margin-top: 30px;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            color: #6c757d;
        }
    </style>
</h:head>

<h:body>

<div class="container">
    <div class="card shadow-sm">
        <div class="card-header bg-success text-white">
            <h3 class="mb-0">📋 Lista de Aspirantes Registrados</h3>
        </div>
        <div class="card-body">
            <h:dataTable value="#{asp.lista}" var="a" 
                         styleClass="table table-striped table-bordered table-hover"
                         headerClass="table-dark">
                
                <h:column>
                    <f:facet name="header">ID / Identificación</f:facet>
                    #{a.identificacion}
                </h:column>
                
                <h:column>
                    <f:facet name="header">Nombres</f:facet>
                    #{a.nombres}
                </h:column>
                
                <h:column>
                    <f:facet name="header">Apellidos</f:facet>
                    #{a.apellidos}
                </h:column>
                
                <h:column>
                    <f:facet name="header">Programa</f:facet>
                    #{a.programa}
                </h:column>
                
                <h:column>
                    <f:facet name="header">Correo</f:facet>
                    #{a.correo}
                </h:column>
                
                <h:column>
                    <f:facet name="header">Teléfono</f:facet>
                    #{a.telefono}
                </h:column>
                
            </h:dataTable>
        </div>
    </div>
    
    <div class="text-center mt-3">
        <h:link value="← Volver al registro" outcome="index.xhtml" styleClass="btn btn-outline-primary"/>
    </div>
</div>

<footer>
    Camilo Camargo - Programación Avanzada Grupo 302, Universidad Distrital - 2026
</footer>

</h:body>
</html>
